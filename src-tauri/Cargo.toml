[package]
name = "blue-streak"
version = "0.1.0"
description = "Blue Streak - Fast file/folder organizer and system maintenance tool"
authors = []
license = ""
repository = ""
default-run = "blue-streak"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "blue_streak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blue-streak"
path = "src/main.rs"

[[bin]]
name = "blue-streak-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

walkdir = "2"
jwalk = "0.8"
rayon = "1"
blake3 = { version = "1", features = ["rayon"] }
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
zip = "0.6"
dirs = "5"
trash = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rusqlite = { version = "0.31", features = ["bundled"] }
twox-hash = "2"
memmap2 = "0.9"
bumpalo = { version = "3", features = ["collections"] }

# Phase 4 dependencies
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "flac", "ogg", "wav", "pcm", "isomp4"] }
csv = "1"
open = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
mft = { version = "0.7", default-features = false }
bincode = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "ioapiset", "winioctl", "handleapi", "winnt", "winbase", "minwinbase", "winsvc", "winuser", "sysinfoapi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
